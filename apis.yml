name: TopKey
description: >-
  TopKey is an AI-powered financial operating system purpose-built for
  professional short-term rental, vacation rental, and long-term rental property
  managers running 50-5,000+ units. It automates property-level and owner-level
  expense management, corporate and bring-your-own cards (BYOC), bill pay / AP,
  banking through partner banks (Thread Bank, Member FDIC), AI-assisted
  accounting, inventory, invoicing, work-order expense tracking, and revenue
  reconciliation. TopKey integrates deeply with property management systems
  (Guesty, Hostaway, OwnerRez, Streamline, Track, Hostfully) and accounting
  software (QuickBooks Online, Xero, Sage Intacct, Oracle NetSuite). Backed by
  a16z and Felicis. TopKey consumes partner APIs for its integrations but does
  not publish a public developer API or OpenAPI at this time; it ships a product
  help center and a machine-readable llms.txt.
